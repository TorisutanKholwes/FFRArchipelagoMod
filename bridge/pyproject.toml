[project]
name = "ffr-bridge"
version = "0.11.0"
description = "Connects FINAL FANTASY RESONANCE (FFResonanceAP UE4SS mod) to an Archipelago server"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["websockets>=13,<16"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ffr-bridge = "ffr_bridge.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ffr_bridge"]
